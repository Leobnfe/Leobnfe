name: Gerar Estatísticas

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# AQUI ESTÁ A SOLUÇÃO: Dando permissão para o bot salvar a imagem no repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4 # Atualizado para remover o aviso amarelo

      - name: Preparar Python
        uses: actions/setup-python@v5 # Atualizado para remover o aviso amarelo
        with:
          python-version: '3.10'

      - name: Instalar biblioteca de requisições
        run: pip install requests

      - name: Executar o motor de estatísticas
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python gerador.py

      - name: Salvar a imagem gerada no repositório
        run: |
          git config --global user.name "Meu Gerador"
          git config --global user.email "bot@github.com"
          git add estatisticas.svg
          git commit -m "Atualizando gráfico de linguagens" || echo "Sem mudanças"
          git push
