<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #1a1b26; rx: 10px; }
        .title { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #c0caf5; }
        .subtitle { font: 14px 'Segoe UI', Arial, sans-serif; fill: #a9b1d6; }
        .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #a9b1d6; }
        .bar-bg { fill: #24283b; rx: 5px; }
        /* Centro de rotação ajustado para a nova altura de 280px */
        .chart { transform: rotate(-90deg); transform-origin: 530px 150px; }
    </style>
    <rect width="100%" height="100%" class="bg"/>
    
    <text x="35" y="40" class="title">Análise do Repositório</text>
    <text x="35" y="60" class="subtitle">Percentual de código por linguagem.</text>
    <g class="chart">
  <circle cx="530" cy="150" r="65" fill="none" stroke="#E34F26" stroke-width="35" stroke-dasharray="258.3668042493691 150.04024071730396" stroke-dashoffset="0" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#1572B6" stroke-width="35" stroke-dasharray="111.2376222011855 297.1694227654876" stroke-dashoffset="-258.3668042493691" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#F7DF1E" stroke-width="35" stroke-dasharray="26.834166404924595 381.5728785617485" stroke-dashoffset="-369.6044264505546" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#306998" stroke-width="35" stroke-dasharray="11.968452111193876 396.4385928554792" stroke-dashoffset="-396.4385928554792" />
</g>

        <text x="35" y="100" class="text">HTML</text>
        <text x="315" y="100" class="text">63.3%</text>
        <rect x="35" y="110" width="315" height="10" class="bar-bg"/>
        <rect x="35" y="110" width="199.27556182384785" height="10" fill="#E34F26" rx="5"/>
        
        <text x="35" y="138" class="text">CSS</text>
        <text x="315" y="138" class="text">27.2%</text>
        <rect x="35" y="148" width="315" height="10" class="bar-bg"/>
