<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #1a1b26; rx: 10px; }
        .title { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #c0caf5; }
        .subtitle { font: 14px 'Segoe UI', Arial, sans-serif; fill: #a9b1d6; }
        .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #a9b1d6; }
        .bar-bg { fill: #24283b; rx: 5px; }
        /* Centro de rotação ajustado para a nova altura de 280px */
        .chart { transform: rotate(-90deg); transform-origin: 530px 150px; }
    </style>
    <rect width="100%" height="100%" class="bg"/>
    
    <text x="35" y="40" class="title">Análise do Repositório</text>
    <text x="35" y="60" class="subtitle">Percentual de código por linguagem.</text>
    <g class="chart">
  <circle cx="530" cy="150" r="65" fill="none" stroke="#E34F26" stroke-width="35" stroke-dasharray="238.93722334985935 169.46982161681373" stroke-dashoffset="0" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#1572B6" stroke-width="35" stroke-dasharray="101.24240468581752 307.16464028085556" stroke-dashoffset="-238.93722334985935" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#F7DF1E" stroke-width="35" stroke-dasharray="57.33438588514376 351.0726590815293" stroke-dashoffset="-340.17962803567684" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#306998" stroke-width="35" stroke-dasharray="10.893031045852432 397.5140139208207" stroke-dashoffset="-397.5140139208206" />
</g>

        <text x="35" y="100" class="text">HTML</text>
