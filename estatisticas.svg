<svg width="700" height="250" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #1a1b26; rx: 10px; }
        .title { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #c0caf5; }
        .subtitle { font: 14px 'Segoe UI', Arial, sans-serif; fill: #a9b1d6; }
        .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #a9b1d6; }
        .bar-bg { fill: #24283b; rx: 5px; }
        /* A origem da rotação foi movida para a direita (530px) para girar o gráfico no lugar certo */
        .chart { transform: rotate(-90deg); transform-origin: 530px 140px; }
    </style>
    <rect width="100%" height="100%" class="bg"/>
    
    <!-- Títulos Profissionais -->
    <text x="35" y="40" class="title">Análise do Repositório</text>
    <text x="35" y="60" class="subtitle">Percentual de código por linguagem.</text>
    <g class="chart">
  <circle cx="530" cy="140" r="65" fill="none" stroke="#E34F26" stroke-width="35" stroke-dasharray="258.63040924030946 149.77663572636362" stroke-dashoffset="0" />
  <circle cx="530" cy="140" r="65" fill="none" stroke="#1572B6" stroke-width="35" stroke-dasharray="111.80035825605133 296.6066867106218" stroke-dashoffset="-258.63040924030946" />
  <circle cx="530" cy="140" r="65" fill="none" stroke="#F7DF1E" stroke-width="35" stroke-dasharray="25.153433986726252 383.2536109799468" stroke-dashoffset="-370.4307674963608" />
  <circle cx="530" cy="140" r="65" fill="none" stroke="#3776AB" stroke-width="35" stroke-dasharray="12.822843483586052 395.58420148308704" stroke-dashoffset="-395.58420148308704" />
</g>

        <text x="35" y="90" class="text">HTML</text>
        <text x="315" y="90" class="text">63.3%</text>
        <rect x="35" y="100" width="315" height="10" class="bar-bg"/>
        <rect x="35" y="100" width="199.47887754322528" height="10" fill="#E34F26" rx="5"/>
        
        <text x="35" y="121" class="text">CSS</text>
        <text x="315" y="121" class="text">27.4%</text>
        <rect x="35" y="131" width="315" height="10" class="bar-bg"/>
        <rect x="35" y="131" width="86.23042448626212" height="10" fill="#1572B6" rx="5"/>
        
        <text x="35" y="152" class="text">JavaScript</text>
        <text x="315" y="152" class="text">6.2%</text>
        <rect x="35" y="162" width="315" height="10" class="bar-bg"/>
        <rect x="35" y="162" width="19.40057548827379" height="10" fill="#F7DF1E" rx="5"/>
        
        <text x="35" y="183" class="text">Python</text>
        <text x="315" y="183" class="text">3.1%</text>
        <rect x="35" y="193" width="315" height="10" class="bar-bg"/>
        <rect x="35" y="193" width="9.890122482238802" height="10" fill="#3776AB" rx="5"/>
        </svg>