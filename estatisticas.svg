  <circle cx="530" cy="150" r="65" fill="none" stroke="#E34F26" stroke-width="35" stroke-dasharray="240.97174385886024 167.43530110781285" stroke-dashoffset="0" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#1572B6" stroke-width="35" stroke-dasharray="102.94846617024905 305.45857879642404" stroke-dashoffset="-240.97174385886024" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#F7DF1E" stroke-width="35" stroke-dasharray="53.410242657920904 354.9968023087522" stroke-dashoffset="-343.9202100291093" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#306998" stroke-width="35" stroke-dasharray="11.07659227964293 397.3304526870302" stroke-dashoffset="-397.3304526870302" />
</g>

        <text x="35" y="100" class="text">HTML</text>
