  <circle cx="530" cy="150" r="65" fill="none" stroke="#E34F26" stroke-width="35" stroke-dasharray="259.1341033119181 149.27294165475496" stroke-dashoffset="0" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#1572B6" stroke-width="35" stroke-dasharray="112.01809435994842 296.3889506067247" stroke-dashoffset="-259.1341033119181" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#F7DF1E" stroke-width="35" stroke-dasharray="25.202421403236663 383.2046235634364" stroke-dashoffset="-371.15219767186653" />
  <circle cx="530" cy="150" r="65" fill="none" stroke="#3776AB" stroke-width="35" stroke-dasharray="12.052425891569904 396.3546190751032" stroke-dashoffset="-396.3546190751032" />
</g>

